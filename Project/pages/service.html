<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Dịch vụ</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="../assets/css/service.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="sidebar">
    <h2>Admin Dashboard</h2>
    <a href="http://127.0.0.1:5500/pages/admin.html">Quản lý lịch</a>
    <a href="http://127.0.0.1:5500/pages/service.html" class="active">Quản lý dịch vụ</a>
    <a href="Home.html">Trang chủ</a>
    <a href="login.html" style="color: #ff4d4f;">Đăng xuất</a>
  </div>

  <div class="main">
    <div class="header-add">
      <h2>Quản lý Dịch vụ</h2>
      <button id="btnAddService">Thêm dịch vụ mới</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Tên dịch vụ</th>
          <th>Mô tả</th>
          <th>Hình ảnh</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="serviceTableBody"></tbody>
    </table>
  </div>
  <div class="modal" id="serviceModal">
    <div class="modal-content">
      <h3 id="modalTitle">Thêm dịch vụ mới</h3>
      <label>Tên dịch vụ</label>
      <input type="text" id="serviceName">
      <label>Mô tả</label>
      <input type="text" id="serviceDescription">
      <label>Hình ảnh (URL)</label>
      <input type="text" id="serviceImage">
      <div class="modal-actions">
        <button id="saveServiceBtn">Lưu</button>
        <button id="closeModalBtn">Huỷ</button>
      </div>
    </div>
  </div>
<div id="confirmModal" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; 
width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center;">
<div style="background: white; padding: 20px 30px; border-radius: 10px; min-width: 300px;">
<p id="confirmText">Bạn có chắc chắn?</p>
<div style="text-align: right; margin-top: 20px;">
 <button id="confirmYes" style="margin-right: 10px;">Có</button>
 <button id="confirmNo">Không</button>
</div>
</div>
</div>
<style>
    #confirmYes, #confirmNo {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  
    #confirmYes {
      background-color: #007bff;
      color: white;
    }
  
    #confirmYes:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
  
    #confirmNo {
      background-color: #f44336;
      color: white;
    }
  
    #confirmNo:hover {
      background-color: #c62828;
      transform: scale(1.05);
    }
  </style>
  

  <div id="toastContainer"></div>
  <script src="../assets/js/service.js"></script>
</body>
</html>
