<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý lịch tập</title>
    <link rel="stylesheet" href="../assets/css/booking.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">GYM MANAGEMENT</div>
            <ul class="nav-links">
                <li><a href="../pages/Home.html">Trang chủ</a></li>
                <li><a href="#">Lịch tập</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <div class="header-container">
            <h2>Quản lý lịch tập</h2>
            <button class="btn-primary" id="btnAddSchedule">Đặt lịch mới</button>
        </div>
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Lớp học</th>
                    <th>Ngày tập</th>
                    <th>Khung giờ</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="scheduleList"></tbody>
        </table>
        <div id="pagination"></div>
    </main>
    <footer>
        <p>&copy; 2025 GYM Management</p>
    </footer>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Đặt lịch mới</h3>
            <form id="scheduleForm">
                <label for="class">Lớp học:</label>
                <select id="class">
                    <option value="Gym">Gym</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Zumba">Zumba</option>
                </select>

                <label for="date">Ngày tập:</label>
                <input type="date" id="date" required>

                <label for="time">Khung giờ:</label>
                <select id="time" required>
                    <option value="06:00 - 09:00">06:00 - 09:00</option>
                    <option value="09:00 - 12:00">09:00 - 12:00</option>
                    <option value="12:00 - 15:00">12:00 - 15:00</option>
                    <option value="15:00 - 18:00">15:00 - 18:00</option>
                    <option value="18:00 - 21:00">18:00 - 21:00</option>
                </select>

                <label for="name">Họ tên:</label>
                <input type="text" id="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <button type="submit" class="btn-primary">Lưu</button>
            </form>
        </div>
    </div>
    <div class="error-mess">
      <div class="header">
        <div class="fram">
          <img src="../assets/img/Vector.png" alt="" />
          <span>Error</span>
        </div>
        <div class="close-btn"></div>
      </div>
      <div class="content">
        Mật khẩu hoặc Email không đúng<br />
        không được bỏ trống
      </div>
    </div>
    <div class="success-mess">
      <div class="icon-succes"></div>
      <div class="content-succes">Đăng nhập thành công</div>
    </div>
    <div id="modalConfirm" class="modal">
        <div class="modal-content">
          <h3>Xác nhận xóa lịch tập</h3>
          <p>Bạn có chắc chắn muốn xóa lịch này không?</p>
          <div style="display: flex; justify-content: space-between; margin-top: 20px; gap:20px;">
            <button id="btnDeleteConfirm" class="btn-danger">Xóa</button>
            <button id="btnDeleteCancel" class="btn-primary">Hủy</button>
          </div>
        </div>
      </div>

    <script src="../assets/js/Booking.js"></script>
</body>
</html>
