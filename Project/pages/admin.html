<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản lý lịch tập</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
    <div class="sidebar">
      <h2>Admin Dashboard</h2>
      <a href="http://127.0.0.1:5500/pages/admin.html" class="active">Quản lý lịch</a>
      <a href="http://127.0.0.1:5500/pages/service.html">Quản lý dịch vụ</a>
      <a href="http://127.0.0.1:5500/pages/Home.html">Trang chủ</a>
      <a href="http://127.0.0.1:5500/pages/login.html" style="color: #af2111;">Đăng xuất</a>
    </div>
    <div class="main">
      <div class="header">Thống kê lịch tập</div>
      <div class="stats">
        <div class="stats-container">
          <div class="stat-item">
            <h3> Tổng số lịch Gym</h3>
            <p id="gymCount" class="stat-value">0</p>
          </div>
          <div class="stat-item">
            <h3> Tổng số lịch Yoga</h3>
            <p id="yogaCount" class="stat-value">0</p>
          </div>
          <div class="stat-item">
            <h3>Tổng số lịch Zumba</h3>
            <p id="zumbaCount" class="stat-value">0</p>
          </div>
        </div>
        <canvas id="scheduleChart" class="chart"></canvas>
      </div>
      <section class="filters">
        <label>Lớp học</label>
        <select id="filterClass">
          <option value="">Tất cả</option>
          <option value="Gym">Gym</option>
          <option value="Yoga">Yoga</option>
          <option value="Zumba">Zumba</option>
        </select>
        <label>Email</label>
        <input type="text" id="filterEmail" placeholder="Tìm theo email">
        <label>Ngày</label>
        <input type="date" id="filterDate">
        <button id="btnFilter"> Lọc ngay !</button>
      </section>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Lớp học</th>
              <th>Ngày tập</th>
              <th>Khung giờ</th>
              <th>Họ tên</th>
              <th>Email</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
    <div class="modal" id="modal">
      <div class="modal-content">
        <h3>Thêm / Sửa lịch</h3>
        <label>Lớp học</label>
        <select id="className">
          <option value="Gym">Gym</option>
          <option value="Yoga">Yoga</option>
          <option value="Zumba">Zumba</option>
        </select>
        <label>Ngày</label>
        <input type="date" id="date">
        <label>Khung giờ</label>
        <input type="text" id="time">
        <label>Họ tên</label>
        <input type="text" id="name">
        <label>Email</label>
        <input type="email" id="email">
        <button onclick="saveSchedule()">Lưu</button>
      </div>
    </div>
    <script>
        if (localStorage.getItem("isAdmin") !== "true") {
          alert("Bạn không có quyền truy cập trang này!");
          window.location.href = "login.html";
        }
      </script>
      <button onclick="logout()" style="margin-left: auto;">Đăng xuất</button>
      <script>
        function logout() {
          localStorage.removeItem("isAdmin");
          window.location.href = "login.html";
        }
      </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
